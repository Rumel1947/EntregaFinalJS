<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Taller Final — JS</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Spline+Sans:wght@500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FFCB05',
                        secondary: '#FF0000',
                        surface: '#121414',
                    },
                    fontFamily: {
                        spline: ['Spline Sans', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white selection:bg-primary/30 selection:text-primary min-h-screen flex flex-col font-inter">

    <!-- Navegación y Encabezado -->
    <header class="sticky top-4 z-50 px-6 max-w-7xl mx-auto w-full">
        <div class="flex items-center justify-between px-8 py-4 rounded-full border border-white/10 bg-black/60 backdrop-blur-2xl shadow-2xl">
            <div class="text-2xl font-black italic tracking-tighter text-primary">Poke-JS</div>
            <nav class="hidden md:flex items-center gap-8">
                <a class="nav-link text-primary" href="#">Pokedex</a>
            </nav>
            <div class="flex items-center gap-4">
                <button class="material-symbols-outlined text-white/70 hover:text-primary transition-colors cursor-pointer">notifications</button>
                <button class="material-symbols-outlined text-white/70 hover:text-primary transition-colors cursor-pointer">account_circle</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 flex-1 w-full">
        <!-- Sección Hero: Introducción visual -->
        <section class="mb-20">
            <div class="glass-card rounded-[2.5rem] p-10 md:p-16 flex flex-col md:flex-row items-center justify-between gap-12 relative overflow-hidden">
                <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 blur-[120px] rounded-full"></div>
                
                <div class="relative z-10 max-w-xl">
                    <h1 class="font-spline text-5xl md:text-7xl font-bold text-white mb-6 leading-[1.1] tracking-tight">
                        ¿Cuál <span class="text-primary italic">Pokemon</span> eres?
                    </h1>
                    <p class="text-white/50 text-lg md:text-xl mb-10 leading-relaxed font-medium">
                        Sumergete en el mundo pokemon, explora e identificate con uno
                    </p>
                    <button class="btn-primary px-10 py-5 rounded-full ring-1 ring-primary/20 group">
                        Busca tu Pokemon
                        <span class="material-symbols-outlined group-hover:translate-x-2 transition-transform">arrow_forward_ios</span>
                    </button>
                </div>

                <div class="relative z-10 w-full md:w-1/2 flex justify-center">
                    <div class="relative">
                        <div class="absolute inset-0 bg-primary/20 blur-[100px] rounded-full"></div>
                        <img id="hero-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                             alt="Hero Pokemon" 
                             class="relative z-10 w-64 md:w-[400px] h-auto drop-shadow-[0_20px_60px_rgba(0,0,0,0.9)] transform transition-all duration-700 hover:scale-105">
                    </div>
                </div>
            </div>
        </section>

        <!-- Filtros y Búsqueda -->
        <section class="mb-16">
            <div class="flex flex-col gap-10 items-center">
                <div class="relative w-full max-w-3xl group">
                    <span class="material-symbols-outlined absolute left-6 top-1/2 -translate-y-1/2 text-white/20 group-focus-within:text-primary transition-colors">search</span>
                    <input id="search-input" 
                           class="w-full bg-surface border border-white/5 rounded-3xl py-6 pl-16 pr-8 text-white focus:ring-2 focus:ring-primary/20 focus:border-primary/50 shadow-2xl transition-all placeholder:text-white/20 font-medium text-lg outline-none" 
                           placeholder="Busca por nombre, id o habilidad..." 
                           type="text">
                </div>
                
                <!-- Botones de filtrado por tipo -->
                <div id="type-filters" class="flex flex-wrap justify-center gap-2 max-w-5xl">
                    <button data-type="all" class="bg-primary text-black px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider shadow-lg shadow-primary/20 hover:brightness-110 transition-all">TODOS LOS TIPOS</button>
                    <button data-type="normal" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Normal</button>
                    <button data-type="fire" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Fire</button>
                    <button data-type="water" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Water</button>
                    <button data-type="grass" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Grass</button>
                    <button data-type="electric" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Electric</button>
                    <button data-type="ice" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Ice</button>
                    <button data-type="fighting" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Fighting</button>
                    <button data-type="poison" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Poison</button>
                    <button data-type="ground" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Ground</button>
                    <button data-type="flying" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Flying</button>
                    <button data-type="psychic" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Psychic</button>
                    <button data-type="bug" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Bug</button>
                    <button data-type="rock" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Rock</button>
                    <button data-type="ghost" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Ghost</button>
                    <button data-type="dragon" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Dragon</button>
                    <button data-type="steel" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Steel</button>
                    <button data-type="fairy" class="glass-card px-4 py-2 rounded-full font-bold text-[10px] uppercase tracking-wider text-white/60 hover:text-primary">Fairy</button>
                </div>
            </div>
        </section>

        <!-- Cuadrícula de Resultados -->
        <section>
            <div id="resultados" class="pokemon-grid">
                <!-- Dinámico -->
            </div>
        </section>

        <!-- Paginación -->
        <section class="mt-12 flex items-center justify-center gap-6">
            <button id="prev-btn" class="glass-card w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-primary disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            
            <div class="glass-card px-6 py-2 rounded-full font-spline text-xs font-bold uppercase tracking-[0.2em] text-white/40">
                Página <span id="current-page" class="text-primary">1</span> de <span id="total-pages" class="text-primary">?</span>
            </div>

            <button id="next-btn" class="glass-card w-12 h-12 rounded-full flex items-center justify-center text-white/60 hover:text-primary transition-all">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </section>
    </main>

    <footer class="bg-surface/50 backdrop-blur-xl rounded-t-[4rem] mt-32 border-t border-white/5 py-12 flex justify-center items-center">
        <p class="text-white/40 font-spline text-sm uppercase tracking-widest font-bold">Hecho por Rumel Escobar — 2026</p>
    </footer>

    <!-- FAB -->
    <button class="fixed bottom-10 right-10 w-16 h-16 bg-primary text-black rounded-full shadow-[0_20px_40px_rgba(255,203,5,0.4)] flex items-center justify-center z-40 group hover:scale-110 transition-all duration-300">
        <span class="material-symbols-outlined font-black text-3xl group-hover:rotate-180 transition-transform duration-500">add</span>
    </button>

    <!-- Modal de Detalles -->
    <div id="pokemon-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 md:p-6">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" id="modal-overlay"></div>
        <div class="glass-card w-full max-w-4xl max-h-[90vh] rounded-[3rem] overflow-hidden relative z-10 flex flex-col md:flex-row animate-fade-in border-white/20 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <button id="close-modal" class="absolute top-6 right-6 w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white z-20 transition-all">
                <span class="material-symbols-outlined">close</span>
            </button>
            
            <div id="modal-content" class="w-full flex flex-col md:flex-row">                
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
